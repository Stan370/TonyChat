<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Brick Breaker</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #080612; color: #f4f0ff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { border-radius: 16px; box-shadow: 0 0 0 1px #2a2148, 0 30px 80px -30px #ff5ea880; cursor: none; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #panel { pointer-events: auto; text-align: center; background: #120d24ee; border: 1px solid #3b2f6b; border-radius: 18px; padding: 22px 28px; max-width: 290px; }
  #panel h1 { margin: 0 0 6px; font-size: 30px; background: linear-gradient(90deg, #ffb13d, #ff5ea8, #8f7bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #panel p { margin: 6px 0; color: #c4bbea; font-size: 14px; line-height: 1.5; }
  #panel button { margin-top: 10px; font: inherit; font-weight: 700; color: #fff; background: linear-gradient(90deg, #ff5ea8, #8f7bff); border: 0; border-radius: 999px; padding: 10px 24px; cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" aria-label="Brick Breaker"></canvas></div>
<div id="overlay">
  <div id="panel">
    <h1 id="title">Brick Breaker</h1>
    <p id="message">Break every brick. Where the ball hits the paddle sets its angle.</p>
    <p style="font-size:12px;color:#8a80b8">Mouse, touch or ← → · Click / Space to launch · P to pause</p>
    <button id="start" type="button">Play</button>
  </div>
</div>
<script>
(() => {
  const W = 480, H = 640;
  const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sandboxed */ } },
  };
  const ROW_COLORS = ["#ff4d6d", "#ff9a3d", "#ffd84d", "#4dff9a", "#36d6ff", "#8f7bff", "#ff5ea8"];
  const COLS = 8, BW = (W - 40 - (COLS - 1) * 6) / COLS, BH = 20;

  let scale = 1, state = "menu", level, score, lives, best = store.get("brick-breaker-best", 0);
  let paddle, ball, bricks, particles = [], trail = [], shake = 0, keys = { left: false, right: false }, banner = null;

  function resize() {
    scale = Math.min((innerWidth - 16) / W, (innerHeight - 16) / H);
    const dpr = devicePixelRatio || 1;
    canvas.style.width = W * scale + "px"; canvas.style.height = H * scale + "px";
    canvas.width = W * scale * dpr; canvas.height = H * scale * dpr;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  addEventListener("resize", resize); resize();

  function buildLevel(n) {
    const rows = Math.min(7, 4 + n);
    const layout = (n - 1) % 3;
    bricks = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++) {
      if (layout === 1 && (r + c) % 2 === 1) continue; // checkerboard
      if (layout === 2 && Math.abs(c - (COLS - 1) / 2) > r + 0.5) continue; // pyramid
      const hp = r === 0 || (n >= 3 && r === 1) ? 2 : 1;
      bricks.push({ x: 20 + c * (BW + 6), y: 80 + r * (BH + 6), w: BW, h: BH, hp, maxHp: hp, color: ROW_COLORS[r % ROW_COLORS.length], points: (rows - r) * 10 });
    }
  }

  function serve() {
    paddle.w = Math.max(60, 92 - (level - 1) * 6);
    ball = { x: paddle.x, y: paddle.y - 9, r: 7, vx: 0, vy: 0, speed: Math.min(560, 320 + (level - 1) * 30), stuck: true };
    trail = [];
  }

  function start() {
    level = 1; score = 0; lives = 3;
    paddle = { x: W / 2, y: H - 46, w: 92, h: 12 };
    buildLevel(level); serve();
    state = "play"; $("overlay").classList.add("hidden");
  }

  function launch() {
    if (!ball.stuck) return;
    const angle = (Math.random() * 0.6 - 0.3);
    ball.vx = Math.sin(angle) * ball.speed; ball.vy = -Math.cos(angle) * ball.speed; ball.stuck = false;
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 220;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.5, color, size: 2 + Math.random() * 3 });
    }
  }

  function loseLife() {
    lives--; shake = 0.4; burst(ball.x, H - 10, "#ff4d6d", 30);
    if (lives <= 0) return gameOver();
    banner = { text: `${lives} ${lives === 1 ? "life" : "lives"} left`, t: 1.2 };
    serve();
  }

  function gameOver() {
    state = "over";
    if (score > best) { best = score; store.set("brick-breaker-best", best); }
    $("title").textContent = "Game over";
    $("message").innerHTML = `Score <b style="color:#fff">${score}</b> · Level ${level}<br>${score >= best && score > 0 ? "New best!" : "Best: " + best}`;
    $("start").textContent = "Play again";
    $("overlay").classList.remove("hidden");
  }

  function pause() {
    if (state === "play") { state = "paused"; $("title").textContent = "Paused"; $("message").textContent = "Press P or Resume to continue."; $("start").textContent = "Resume"; $("overlay").classList.remove("hidden"); }
    else if (state === "paused") { state = "play"; $("overlay").classList.add("hidden"); }
  }
  $("start").addEventListener("click", () => (state === "paused" ? pause() : start()));

  // Input
  function pointerX(clientX) { const rect = canvas.getBoundingClientRect(); return ((clientX - rect.left) / rect.width) * W; }
  canvas.addEventListener("mousemove", e => { if (paddle) paddle.x = pointerX(e.clientX); });
  canvas.addEventListener("mousedown", () => { if (state === "play") launch(); });
  canvas.addEventListener("touchstart", e => { if (paddle) paddle.x = pointerX(e.touches[0].clientX); if (state === "play") launch(); }, { passive: true });
  canvas.addEventListener("touchmove", e => { if (paddle) paddle.x = pointerX(e.touches[0].clientX); }, { passive: true });
  addEventListener("keydown", e => {
    if (["ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
    if (e.code === "Space" || e.code === "Enter") { if (state === "play") launch(); else if (state === "menu" || state === "over") start(); else if (state === "paused") pause(); }
    if (e.code === "KeyP" || e.code === "Escape") pause();
  });
  addEventListener("keyup", e => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
  });

  function circleRect(b, r) {
    const cx = Math.max(r.x, Math.min(b.x, r.x + r.w)), cy = Math.max(r.y, Math.min(b.y, r.y + r.h));
    const dx = b.x - cx, dy = b.y - cy;
    return dx * dx + dy * dy <= b.r * b.r;
  }

  function update(dt) {
    if (keys.left) paddle.x -= 560 * dt;
    if (keys.right) paddle.x += 560 * dt;
    paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));
    if (banner && (banner.t -= dt) <= 0) banner = null;
    if (ball.stuck) { ball.x = paddle.x; ball.y = paddle.y - ball.r - 2; return; }

    const steps = Math.ceil((Math.hypot(ball.vx, ball.vy) * dt) / 4);
    for (let i = 0; i < steps; i++) {
      ball.x += (ball.vx * dt) / steps; ball.y += (ball.vy * dt) / steps;
      if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
      if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y < 44 + ball.r) { ball.y = 44 + ball.r; ball.vy = Math.abs(ball.vy); }
      if (ball.y > H + ball.r) return loseLife();

      const pr = { x: paddle.x - paddle.w / 2, y: paddle.y, w: paddle.w, h: paddle.h };
      if (ball.vy > 0 && circleRect(ball, pr)) {
        const offset = Math.max(-1, Math.min(1, (ball.x - paddle.x) / (paddle.w / 2)));
        const angle = offset * (Math.PI / 3);
        ball.vx = Math.sin(angle) * ball.speed; ball.vy = -Math.cos(angle) * ball.speed;
        ball.y = paddle.y - ball.r;
        burst(ball.x, paddle.y, "#c9b8ff", 6);
      }

      for (const brick of bricks) {
        if (brick.hp <= 0 || !circleRect(ball, brick)) continue;
        // Bounce off the side with the smallest penetration.
        const overlapX = Math.min(ball.x + ball.r - brick.x, brick.x + brick.w - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - brick.y, brick.y + brick.h - (ball.y - ball.r));
        if (overlapX < overlapY) { ball.vx = ball.x < brick.x + brick.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx); }
        else { ball.vy = ball.y < brick.y + brick.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy); }
        brick.hp--;
        if (brick.hp <= 0) {
          score += brick.points; shake = Math.min(0.3, shake + 0.12);
          burst(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color, 18);
          ball.speed = Math.min(640, ball.speed + 6);
          const k = ball.speed / Math.hypot(ball.vx, ball.vy); ball.vx *= k; ball.vy *= k;
        } else {
          burst(ball.x, ball.y, "#ffffff", 6);
        }
        break;
      }
    }
    trail.push({ x: ball.x, y: ball.y }); if (trail.length > 10) trail.shift();

    if (bricks.every(b => b.hp <= 0)) {
      level++; score += 100; banner = { text: `Level ${level}`, t: 1.4 };
      buildLevel(level); serve();
    }
  }

  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

  function draw(time) {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 14 * shake, (Math.random() - 0.5) * 14 * shake);
    const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#160f2e"); bg.addColorStop(1, "#08060f");
    ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
    for (let i = 0; i < 40; i++) { const x = (i * 97) % W, y = (i * 53 + time * 0.01 * (1 + (i % 3))) % H; ctx.fillStyle = `rgba(255,255,255,${0.08 + (i % 4) * 0.05})`; ctx.fillRect(x, y, 2, 2); }

    // HUD
    ctx.fillStyle = "#c4bbea"; ctx.font = "600 15px system-ui, sans-serif"; ctx.textBaseline = "middle";
    ctx.fillText(`SCORE ${score ?? 0}`, 18, 24);
    ctx.textAlign = "center"; ctx.fillText(`LEVEL ${level ?? 1}`, W / 2, 24);
    ctx.textAlign = "right"; ctx.fillStyle = "#ff5ea8"; ctx.fillText("♥".repeat(Math.max(0, lives ?? 3)), W - 18, 24);
    ctx.textAlign = "left";
    ctx.fillStyle = "#2a2148"; ctx.fillRect(0, 43, W, 1);

    if (bricks) bricks.forEach(b => {
      if (b.hp <= 0) return;
      ctx.shadowColor = b.color; ctx.shadowBlur = 12;
      const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h); g.addColorStop(0, b.color); g.addColorStop(1, "#00000055");
      ctx.fillStyle = b.color; roundRect(b.x, b.y, b.w, b.h, 5); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = g; roundRect(b.x, b.y, b.w, b.h, 5); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fillRect(b.x + 4, b.y + 3, b.w - 8, 3);
      if (b.maxHp > 1) { ctx.strokeStyle = b.hp < b.maxHp ? "#ffffffcc" : "#ffffff66"; ctx.lineWidth = 2; roundRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4, 4); ctx.stroke(); }
    });

    if (paddle) {
      ctx.shadowColor = "#8f7bff"; ctx.shadowBlur = 18;
      const pg = ctx.createLinearGradient(paddle.x - paddle.w / 2, 0, paddle.x + paddle.w / 2, 0); pg.addColorStop(0, "#ff5ea8"); pg.addColorStop(1, "#8f7bff");
      ctx.fillStyle = pg; roundRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, 6); ctx.fill();
    }
    if (ball) {
      trail.forEach((p, i) => { ctx.globalAlpha = (i / trail.length) * 0.35; ctx.fillStyle = "#c9b8ff"; ctx.beginPath(); ctx.arc(p.x, p.y, ball.r * (i / trail.length), 0, Math.PI * 2); ctx.fill(); });
      ctx.globalAlpha = 1; ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 16; ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowBlur = 0;
    particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); });
    ctx.globalAlpha = 1;

    if (state === "play" && ball && ball.stuck) { ctx.fillStyle = "#c4bbea"; ctx.textAlign = "center"; ctx.font = "500 14px system-ui, sans-serif"; ctx.fillText("Click, tap or press Space to launch", W / 2, H - 90); ctx.textAlign = "left"; }
    if (banner) { ctx.globalAlpha = Math.min(1, banner.t * 2); ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "800 34px system-ui, sans-serif"; ctx.fillText(banner.text, W / 2, H / 2); ctx.textAlign = "left"; ctx.globalAlpha = 1; }
    ctx.restore();
  }

  let last = 0;
  function frame(t) {
    const dt = Math.min(0.033, (t - last) / 1000 || 0); last = t;
    if (state === "play") update(dt);
    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt * 1.3; });
    particles = particles.filter(p => p.life > 0);
    shake = Math.max(0, shake - dt);
    draw(t);
    requestAnimationFrame(frame);
  }
  // Attract screen: show a level behind the menu.
  level = 1; score = 0; lives = 3; paddle = { x: W / 2, y: H - 46, w: 92, h: 12 }; buildLevel(1); serve();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
